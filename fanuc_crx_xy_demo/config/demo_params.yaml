dual_as5600_mux_node:
  ros__parameters:
    i2c_bus: 1
    mux_address: 112
    sensor_address: 54
    x_channel: 0
    y_channel: 1
    publish_hz: 50.0
    x_zero_deg: 180.0
    y_zero_deg: 180.0
    x_scale_mm_per_deg: 0.5
    y_scale_mm_per_deg: 0.5
    x_limit_min_mm: -75.0
    x_limit_max_mm: 75.0
    y_limit_min_mm: -75.0
    y_limit_max_mm: 75.0

xy_target_node:
  ros__parameters:
    base_frame: world
    target_topic: demo_target_pose
    z_mm: 250.0
    yaw_deg: 0.0
    x_offset_mm: 400.0
    y_offset_mm: 0.0
    publish_target: true
